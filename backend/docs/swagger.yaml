basePath: /api
definitions:
  auth.userAuthDTO:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  files.deleteFileDTO:
    properties:
      file_id:
        type: integer
    type: object
  remotes.AddRemoteDTO:
    properties:
      base_path:
        type: string
      host:
        type: string
      host_port:
        type: integer
      host_user:
        type: string
      public_key:
        type: string
    type: object
  settings.changeUserPasswordDTO:
    properties:
      old_password:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
  description: This is an API for clocess project
  title: clocess backend API
  version: "1.0"
paths:
  /file/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: file_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/files.deleteFileDTO'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a file
      tags:
      - files
  /file/download:
    get:
      parameters:
      - description: file id
        in: query
        name: file_id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download a file
      tags:
      - files
  /file/get_all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the current user's files
      tags:
      - files
  /file/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload a file
      tags:
      - files
  /health/ping:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /remote/add_remote:
    post:
      consumes:
      - application/json
      description: Client must already hold the public key returned by GET /remote/get_key.
      parameters:
      - description: host, host_user, host_port, base_path, public_key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/remotes.AddRemoteDTO'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a remote server (SSH/SFTP) for the current user
      tags:
      - remotes
  /remote/get_key:
    get:
      description: Private key stays server-side and never leaves this handler as-is
        (see TODO below); client only ever gets the public key to paste into their
        server's authorized_keys.
      responses:
        "200":
          description: publicClientKey
          schema:
            additionalProperties: true
            type: object
        "401":
          description: invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate a keypair for a new remote and return the public half
      tags:
      - remotes
  /remote/get_remotes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the current user's connected remotes
      tags:
      - remotes
  /user/create:
    post:
      consumes:
      - application/json
      description: Creates a user account and starts a session
      parameters:
      - description: email + password (min 8 chars)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.userAuthDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid body / invalid email / password too short / too long
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: email already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /user/login:
    post:
      consumes:
      - application/json
      description: Verifies credentials and starts a new session, a deactivated account
        is refused
      parameters:
      - description: email + password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.userAuthDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: this account is deactivated
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /user/logout:
    post:
      description: Deletes the current session
      responses:
        "200":
          description: session deleted
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out
      tags:
      - auth
  /user/me:
    get:
      description: Resolves the session cookie and returns the logged-in user's id
        and email
      produces:
      - application/json
      responses:
        "200":
          description: user_id, email
          schema:
            additionalProperties: true
            type: object
        "401":
          description: invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user
      tags:
      - auth
  /user/settings/change_password:
    patch:
      consumes:
      - application/json
      description: Requires an active session and confirmation of the current password,
        ends every other session
      parameters:
      - description: old_password + new_password (min 8 chars)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/settings.changeUserPasswordDTO'
      responses:
        "200":
          description: password changed
        "400":
          description: invalid body / password too short
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: current password is wrong
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change password
      tags:
      - settings
  /user/settings/deactivate:
    post:
      responses:
        "200":
          description: account deactivated
        "401":
          description: invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deactivate the current account
      tags:
      - settings
swagger: "2.0"
